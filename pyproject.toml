[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence-probes"
version = "0.1.0"
description = "Research toolkit for testing whether autonomous-agent actions are supported by fresh, independent, non-conflicting evidence."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Syed Hafiz Ali"}]

[tool.setuptools]
py-modules = ["agent_evidence_probes"]
